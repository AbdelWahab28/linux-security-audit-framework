[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsaf"
version = "0.1.0"
description = "Linux Security Audit Framework : collecte de preuves en lecture seule, analyse croisée C18 et livrables Excel / Word"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
validation = ["jsonschema>=4.0"]
dev = ["pytest>=7", "pyflakes>=3", "jsonschema>=4.0"]

[project.scripts]
lsaf = "lsaf.cli:main"

[tool.setuptools]
packages = ["lsaf", "lsaf.extraction", "lsaf.donnees"]

[tool.setuptools.package-data]
"lsaf.donnees" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
